version: 2
updates:
  # Backend dependencies
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 30
    # Extras-bearing requirements (pydantic[email], uvicorn[standard], ...) resolve
    # to an empty previous version from pyproject, which discards the whole group.
    # Deriving versions from uv.lock instead avoids that.
    versioning-strategy: lockfile-only
    labels:
      - "dependencies"
      - "backend"
    groups:
      backend-all:
        patterns:
          - "*"

  # Frontend dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 30
    labels:
      - "dependencies"
      - "frontend"
    groups:
      frontend-all:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci/cd"
    groups:
      github-actions-all:
        patterns:
          - "*"

  # Docker
  - package-ecosystem: "docker"
    directory: "/.docker"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "containerization"
    groups:
      docker-all:
        patterns:
          - "*"
